# ─────────────────────────────────────────────────────────────
# 첫단추 시연용 원장 생성기 — 설정 파일
# 이 파일만 고치고 `python3 generate.py` 를 다시 돌리면 원장이 새로 만들어져요.
# 금액은 모두 원 단위, 100원 단위로 써 주세요.
# 날짜는 2026-10-19 처럼, "달"은 "2026-10" 처럼 씁니다.
# "정산 달 2026-10" = 9월 26일 ~ 10월 25일 결제분을 10월 25일에 정산하는 기간
# ─────────────────────────────────────────────────────────────

[demo]
today = 2026-10-19      # 데모 기준일. 이 날까지의 기록만 만들어요
seed = 42               # 같은 숫자면 매번 똑같은 원장이 나와요. 바꾸면 매일 결제 내역이 달라져요
bank_name = "첫단추은행"  # 시연용 가상 은행 이름

[rules]                 # 서비스 규칙 — 보통은 고치지 않아요
allowance_day = 1       # 용돈일
payday = 25             # 결제일
settle_time = "18:00"   # 결제일 자동 정산 시각
mission_cap_ratio = 0.30  # 한 달 미션 보상 상한 (용돈의 30%)

# 매일 쓰는 돈의 모양. 실제 금액은 그달 "얼마나 쓸지"에 맞춰 생성기가 조절해요
# per_week = 일주일에 몇 번, fixed = 금액이 정해진 항목(교통)은 조절하지 않음
[[spend]]
category = "교통"
merchants = ["버스", "지하철"]
min = 1500
max = 1500
per_week = 2.5
weekday_only = true
fixed = true
vacation_factor = 0.3   # 방학(1·2·7·8월)에는 30%만

[[spend]]
category = "식사"
merchants = ["편의점", "분식집", "패스트푸드", "김밥집"]
min = 2500
max = 9000
per_week = 4

[[spend]]
category = "카페"
merchants = ["카페"]
min = 2000
max = 6500
per_week = 1.5

[[spend]]
category = "쇼핑"
merchants = ["드럭스토어", "생활용품점", "온라인 쇼핑몰"]
min = 3000
max = 25000
per_week = 0.6

[[spend]]
category = "문화"
merchants = ["영화관", "서점", "코인노래방"]
min = 2000
max = 13000
per_week = 0.4


